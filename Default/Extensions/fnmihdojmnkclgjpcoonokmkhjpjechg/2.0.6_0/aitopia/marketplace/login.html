<!DOCTYPE html>
<html lang="en">

<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>
  

  

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Smart Sidebar (AITOPIA)</title>
  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">
  <script src="/aitopia/marketplace/js/vendor/api.js" defer></script>
  <script src="/aitopia/marketplace/js/inline/login-inline-2.js"></script>
  <style>
    .btn-primary {
      background: linear-gradient(135deg, #9335EC 0%, #7c3aed 100%);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    }
  </style>
</head>

<body class="min-h-screen bg-gray-50 flex aifnmjmchg aifnmjmchg-marketplace">


  <!-- Left Side - Form -->
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="w-full max-w-sm">
      <!-- Logo -->
      <a href="/aitopia/marketplace/home.html" class="inline-flex items-center gap-2 mb-8">
        <div class="w-8 h-8 rounded-xl bg-brand-600 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <span class="text-xl font-semibold text-gray-900">AITOPIA</span>
      </a>

      <!-- Header -->
      <h1 class="text-2xl font-semibold text-gray-900 mb-2">Welcome back</h1>
      <p class="text-gray-500 mb-8">Sign in to your account to continue</p>

      <!-- OAuth Buttons -->
      <div class="space-y-3 mb-6">
        <button data-action="handleGoogleLogin"
          class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm font-medium text-gray-700 hover:bg-gray-50 hover:border-gray-300 transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Continue with Google
        </button>

        <button data-action="handleAppleLogin"
          class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-black rounded-xl text-sm font-medium text-white hover:bg-gray-800 transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
          </svg>
          Continue with Apple
        </button>
      </div>

      <!-- Divider -->
      <div class="relative mb-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center">
          <span class="px-3 bg-gray-50 text-xs text-gray-400 uppercase tracking-wide">or</span>
        </div>
      </div>

      <!-- Email Form -->
      <form id="loginForm" data-onsubmit="handleEmailLogin" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
          <input type="email" id="email" name="email" required
            class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all"
            placeholder="name@example.com">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
          <input type="password" id="password" name="password" required
            class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all"
            placeholder="Enter your password">
        </div>
        <!-- Error/Success Messages -->
        <div id="errorMessage" class="hidden p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 text-sm"></div>
        <div id="successMessage"
          class="hidden p-3 bg-green-50 border border-green-100 rounded-xl text-green-600 text-sm"></div>

        <button type="submit" id="submitBtn"
          class="w-full py-3 px-4 btn-primary text-white text-sm font-medium rounded-xl transition-all disabled:opacity-50">
          Sign in
        </button>
      </form>

      <!-- Footer -->
      <p class="mt-6 text-center text-sm text-gray-500">
        Don't have an account?
        <a href="/aitopia/marketplace/register.html" class="text-brand-600 hover:text-brand-700 font-medium">Sign up</a>
      </p>
    </div>
  </div>

  <!-- Right Side - Branding -->
  <div class="hidden lg:flex flex-1 bg-gradient-to-br from-brand-600 to-brand-700 items-center justify-center p-12">
    <div class="max-w-md text-center">
      <div class="w-16 h-16 mx-auto mb-6 rounded-2xl bg-primary-foreground/10 backdrop-blur flex items-center justify-center">
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path
            d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
        </svg>
      </div>
      <h2 class="text-2xl font-semibold text-white mb-3">AI-Powered Agents</h2>
      <p class="text-white/70 text-sm leading-relaxed">
        Access 150+ AI agents for image generation, video creation, audio processing, and more. Build amazing things
        with the power of AI.
      </p>
    </div>
  </div>

  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/inline/login-inline-3.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>

</html>
