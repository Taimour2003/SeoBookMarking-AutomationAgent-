<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="Chat with the Superagent to search agents, run models, and orchestrate workflows.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">

  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">
  <script src="/aitopia/marketplace/agenticai/gate.js"></script>

  <script src="/aitopia/marketplace/js/inline/assistant-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/assistant-inline-2.js"></script>
</head>

<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div class="mx-auto w-full max-w-[850px] h-[100dvh] flex flex-col">
    <!-- Header (AgenticAI-style) -->
    <header class="flex items-center justify-between gap-3 px-4 py-4 border-b border-border bg-card">
      <div class="min-w-0 flex items-center gap-3">
        <div class="h-2 w-2 rounded-full bg-primary"></div>
        <div class="min-w-0">
          <div class="font-semibold truncate">Assistant</div>
          <div class="text-xs text-muted-foreground truncate">Superagent • tool-using orchestration</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="settingsBtn" type="button" class="h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
          Settings
        </button>
        <button id="newChatBtn" type="button" class="h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
          New chat
        </button>
      </div>
    </header>

    <!-- Chat -->
    <main id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-4">
      <div class="rounded-ios-2xl border border-border bg-background/40 p-4">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-ios-xl bg-gradient-to-br from-primary/90 to-indigo-600 flex items-center justify-center text-white font-bold">
            ✨
          </div>
          <div class="min-w-0">
            <div class="font-semibold">How can I help?</div>
            <div class="text-sm text-muted-foreground mt-1">
              Ask me to find the right agent, run it, or orchestrate multi-step tasks. I’ll show tool calls inline as I work.
            </div>
            <div class="mt-3 flex flex-wrap gap-2">
              <button class="suggestion h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors" data-prompt="Find the best agent for removing image backgrounds, then run it.">
                Remove background
              </button>
              <button class="suggestion h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors" data-prompt="Generate a short NatGeo-style documentary script about the discovery of Peru.">
                NatGeo script
              </button>
              <button class="suggestion h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors" data-prompt="List 5 popular video generation models and explain differences.">
                Video models
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Input -->
    <footer class="px-4 py-4 border-t border-border bg-card">
      <div class="flex gap-3">
        <textarea
          id="input"
          rows="1"
          placeholder="Send a message…"
          class="flex-1 min-h-[44px] max-h-40 px-4 py-3 rounded-ios-xl bg-secondary/80 border-0 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all resize-none"
        ></textarea>
        <button id="sendBtn" type="button" class="h-11 px-6 rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">
          Send
        </button>
      </div>
      <div id="hint" class="mt-2 text-xs text-muted-foreground"></div>
    </footer>
  </div>

  <script type="module" src="/aitopia/marketplace/js/shared/fetch-helper.js"></script>
  <script type="module" src="/aitopia/marketplace/js/assistant/assistant.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
