<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="Discover public creations and remixes.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">

  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">
  <link rel="stylesheet" href="/aitopia/marketplace/social.css">

  <script src="/aitopia/marketplace/js/inline/discover-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/discover-inline-2.js"></script>
</head>

<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-8">
    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Discover</h1>
        <p class="text-sm text-muted-foreground mt-2">Explore public creations and remixes.</p>
      </div>

      <a href="/aitopia/marketplace/feed.html" class="h-11 px-5 inline-flex items-center justify-center rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
        Go to Feed
      </a>
    </div>

    <div class="mt-6 flex flex-col lg:flex-row lg:items-center gap-3">
      <div class="inline-flex rounded-full bg-secondary p-1 w-fit">
        <button id="tabAll" type="button" class="px-4 py-2 text-sm font-medium rounded-full bg-background shadow-sm">All</button>
        <button id="tabCreations" type="button" class="px-4 py-2 text-sm font-medium rounded-full text-muted-foreground hover:text-foreground">Creations</button>
        <button id="tabRemixes" type="button" class="px-4 py-2 text-sm font-medium rounded-full text-muted-foreground hover:text-foreground">Remixes</button>
        <button id="sortNew" type="button" class="hidden" aria-hidden="true">New</button>
        <button id="sortTrending" type="button" class="hidden" aria-hidden="true">Trending</button>
      </div>

      <div class="flex-1 flex flex-col sm:flex-row gap-2">
        <div class="relative flex-1">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="search" placeholder="Search titles / agent ids…" class="w-full h-11 pl-10 pr-4 rounded-full bg-secondary/80 border-0 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all">
        </div>
        <input id="tagInput" type="text" placeholder="Tag (optional)" class="h-11 px-4 rounded-full bg-secondary/80 border-0 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all">
      </div>
    </div>

    <div id="notice" class="mt-6 hidden rounded-ios-xl border border-border bg-card p-4 text-sm"></div>

    <div id="grid" class="social-grid mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

    <div id="emptyState" class="hidden mt-14 text-center">
      <div class="w-16 h-16 mx-auto rounded-ios-2xl bg-secondary flex items-center justify-center text-3xl">🔎</div>
      <h2 class="mt-5 text-xl font-semibold">No results</h2>
      <p class="mt-2 text-sm text-muted-foreground">Try another search or remove filters.</p>
    </div>

    <div class="mt-10 flex justify-center">
      <button id="loadMore" type="button" class="hidden h-11 px-6 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
        Load more
      </button>
    </div>
    <div id="scrollSentinel" aria-hidden="true"></div>
  </main>

  <script type="module" src="/aitopia/marketplace/js/shared/fetch-helper.js"></script>
  <script type="module" src="/aitopia/marketplace/js/discover/discover.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
