<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Sidebar Options" />
    <title>AI Sidebar – Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="options-page">
      <!-- Header -->
      <header class="header">

        <span class="version-badge">v1.6.6</span>
      </header>

      <!-- Rating Card -->
      <section class="card" id="ratingCard">
        <h2 class="card-title">Do you enjoy DeepSeek?</h2>
        <p class="card-subtitle">We'd love to hear your feedback!</p>
        <div class="stars-container" role="img" aria-label="Five star rating">
          <img src="star.svg" alt="" class="star-icon" width="22" height="22" />
          <img src="star.svg" alt="" class="star-icon" width="22" height="22" />
          <img src="star.svg" alt="" class="star-icon" width="22" height="22" />
          <img src="star.svg" alt="" class="star-icon" width="22" height="22" />
          <img src="star.svg" alt="" class="star-icon" width="22" height="22" />
        </div>
        <button type="button" class="rate-btn" id="rateUsButton">
          ⭐ Rate Us on Chrome Web Store
        </button>
      </section>

      <!-- Settings Card -->
      <section class="card" id="settingsCard">
        <h2 class="card-title">Settings</h2>
        <div class="setting-row">
          <div class="setting-info">
            <span class="setting-label">AI Sidebar</span>
            <span class="setting-desc">Enable the AI sidebar on web pages</span>
          </div>
          <label class="toggle-switch" for="switchToggle">
            <input type="checkbox" id="switchToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </section>

      <!-- Footer -->
      <footer class="footer">
        <a href="#" id="privacyLink">Privacy Policy</a>
        <span class="footer-sep">·</span>
        <span class="footer-text">Powered by aitopia.ai</span>
      </footer>
    </div>

    <script src="options.js"></script>
  </body>
</html>
