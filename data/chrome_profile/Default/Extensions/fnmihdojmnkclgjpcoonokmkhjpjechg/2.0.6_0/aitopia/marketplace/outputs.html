    /* Pinterest-style layout */
    .creations-masonry-grid {
      margin: 0 auto;

    .creations-masonry-grid .creations-card {
      width: calc(50% - 4px);
    }
    @media (min-width: 768px) {
      .creations-masonry-grid .grid-sizer,
      .creations-masonry-grid .creations-card {
        width: calc(33.333% - 6px);
      }
    }
    @media (min-width: 1024px) {
      .creations-masonry-grid .grid-sizer,
      .creations-masonry-grid .creations-card {
        width: calc(25% - 6px);
      }
    }
    @media (min-width: 1400px) {
      .creations-masonry-grid .grid-sizer,
      .creations-masonry-grid .creations-card {
        width: calc(20% - 7px);
      }
    }
    .creations-masonry-grid .creations-card {
      margin-bottom: 8px;
    }
    .creations-masonry-grid .creations-card > div {
      position: relative;
      overflow: hidden;
      border-radius: var(--tw-rounded-ios-xl, 20px);
    }
    .creations-masonry-grid .creations-card img,
    .creations-masonry-grid .creations-card video {
      width: 100%;
      height: auto;
      display: block;
      vertical-align: middle;
    }
    .creations-masonry-grid .creations-card .creations-card-placeholder {
      width: 100%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>

            </a>
            <button id="modalPublish" type="button" class="hidden h-12 items-center justify-center gap-2 rounded-ios-xl bg-primary hover:bg-primary/90 text-primary-foreground text-sm font-semibold transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
              </svg>
              Publish
            </button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <button id="modalDownload" type="button" class="h-11 flex items-center justify-center gap-2 rounded-ios-xl bg-secondary hover:bg-secondary/80 text-foreground text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
              </svg>
              Download
            </button>
            <button id="modalUpscale" type="button" class="h-11 flex items-center justify-center gap-2 rounded-ios-xl bg-secondary hover:bg-secondary/80 text-foreground text-sm font-medium transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/>
              </svg>
              Upscale
            </button>
          </div>
          <div id="modalReportWrap" class="hidden w-full flex justify-center mt-1">
            <button id="modalReport" type="button" data-report-text-mode="true" class="text-xs text-muted-foreground hover:text-foreground transition-colors">
              Report
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="modalReportOverlay" class="hidden fixed inset-0 z-50">
    <div id="modalReportBackdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="absolute inset-x-0 top-20 mx-auto w-[min(560px,92vw)] rounded-ios-2xl border border-border bg-card shadow-xl overflow-hidden">
      <div class="p-4 border-b border-border flex items-center justify-between">
        <div class="font-semibold">Report creation</div>
        <button id="modalReportClose" type="button" class="h-9 px-3 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">Close</button>
      </div>
      <form id="modalReportForm" class="p-5 space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Reason</label>
          <select id="modalReportReason" class="w-full h-11 px-4 rounded-full bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all">
            <option value="nsfw">NSFW / Sexual content</option>
            <option value="spam">Spam</option>
            <option value="copyright">Copyright</option>
            <option value="hate">Hate / Harassment</option>
            <option value="violence">Violence</option>
            <option value="impersonation">Impersonation</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Details (optional)</label>
          <textarea id="modalReportDetails" rows="4" maxlength="500" class="w-full p-4 rounded-ios-xl bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Add context for moderators…"></textarea>
        </div>
        <div class="pt-2 flex items-center gap-2">
          <button id="modalReportSubmitBtn" type="submit" class="h-11 px-6 rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">Submit report</button>
          <button id="modalReportCancelBtn" type="button" class="h-11 px-6 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/aitopia/marketplace/js/shared/fetch-helper.js"></script>
  <script type="module" src="/aitopia/marketplace/js/outputs/outputs.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
