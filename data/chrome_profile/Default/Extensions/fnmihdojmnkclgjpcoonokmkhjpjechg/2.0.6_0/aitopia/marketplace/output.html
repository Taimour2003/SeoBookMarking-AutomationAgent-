<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="View a creation and remix it.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">

  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">

  <script src="/aitopia/marketplace/js/inline/output-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/output-inline-2.js"></script>
</head>

<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-8 max-w-5xl">
    <div class="flex items-center justify-between gap-3">
      <div class="text-sm text-muted-foreground">
        <a href="/aitopia/marketplace/outputs.html" class="hover:text-foreground transition-colors">Creations</a>
        <span class="mx-2">/</span>
        <span id="crumbTitle" class="text-foreground/80">Creation</span>
      </div>

      <div class="flex items-center gap-2">
        <button id="copyLinkBtn" type="button" class="h-10 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
          Copy link
        </button>
        <button id="likeBtn" type="button" class="hidden" aria-hidden="true">Like</button>
        <button id="editBtn" type="button" class="hidden h-10 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
          Edit
        </button>
        <button id="deleteBtn" type="button" class="hidden h-10 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors text-red-500">
          Delete
        </button>
        <div id="reportBtnWrap" class="hidden w-full flex justify-center">
          <button id="reportBtn" type="button" data-report-text-mode="true" class="text-xs text-muted-foreground hover:text-foreground transition-colors">
            Report
          </button>
        </div>
        <a id="remixBtn" href="/aitopia/marketplace/uap.html" class="h-10 px-4 inline-flex items-center justify-center rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">
          Remix creation
        </a>
      </div>
    </div>

    <div id="statusBanner" class="mt-6 hidden rounded-ios-xl border border-border bg-card p-4 text-sm"></div>

    <div class="mt-6 rounded-ios-2xl border border-border bg-card overflow-hidden">
      <div class="p-5 border-b border-border flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 id="title" class="text-2xl font-bold tracking-tight truncate">Loading…</h1>
          <div class="mt-2 flex items-center gap-3 text-sm">
            <a id="creatorHeaderLink" href="#" class="inline-flex items-center gap-2 hover:opacity-90 transition-opacity">
              <img
                id="creatorAvatar"
                src=""
                alt=""
                class="hidden h-7 w-7 rounded-full object-cover border border-border"
              />
              <span
                id="creatorAvatarFallback"
                aria-hidden="true"
                class="inline-flex h-7 w-7 items-center justify-center rounded-full bg-secondary text-xs font-semibold text-muted-foreground border border-border"
              >@</span>
              <span id="creatorUsername" class="font-semibold text-foreground">@anonymous</span>
            </a>
            <span id="creatorTime" class="text-muted-foreground"></span>
            <button
              id="followCreatorBtn"
              type="button"
              class="hidden h-8 px-3 rounded-full bg-secondary hover:bg-secondary/80 text-xs font-semibold transition-colors"
            >
              Follow
            </button>
          </div>
          <p id="meta" class="mt-2 text-sm text-muted-foreground"></p>
          <div id="tags" class="mt-3 flex flex-wrap gap-2"></div>
        </div>
      </div>

      <div class="p-5">
        <div id="outputContainer" class="min-h-[220px]"></div>
      </div>
    </div>

    <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="rounded-ios-2xl border border-border bg-card p-6">
        <h2 class="font-semibold">Created with</h2>
        <p class="mt-2 text-sm text-muted-foreground">Open the source agent/app in UAP.</p>
        <div class="mt-4 flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div id="sourceStoreId" class="text-sm font-semibold truncate">—</div>
            <div id="sourceStatus" class="text-xs text-muted-foreground mt-1">—</div>
          </div>
          <a id="openSourceBtn" href="/aitopia/marketplace/uap.html" class="h-10 px-4 inline-flex items-center justify-center rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
            Open
          </a>
        </div>
      </div>

      <div class="rounded-ios-2xl border border-border bg-card p-6">
        <h2 class="font-semibold">Lineage</h2>
        <p class="mt-2 text-sm text-muted-foreground">If this creation was remixed, view its parent.</p>
        <div id="lineage" class="mt-4 text-sm text-muted-foreground">—</div>
      </div>
    </div>

    <form id="commentForm" class="hidden" aria-hidden="true"></form>
    <div id="remixesGrid" class="hidden" aria-hidden="true"></div>
  </main>

  <script type="module" src="/aitopia/marketplace/js/shared/fetch-helper.js"></script>
  <script type="module" src="/aitopia/marketplace/js/outputs/output-detail.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>

  <!-- Edit modal -->
  <div id="editModal" class="hidden fixed inset-0 z-50">
    <div id="editModalBackdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="absolute inset-x-0 top-10 mx-auto w-[min(720px,92vw)] rounded-ios-2xl border border-border bg-card shadow-xl overflow-hidden">
      <div class="p-4 border-b border-border flex items-center justify-between">
        <div class="font-semibold">Edit creation</div>
        <button id="editModalClose" type="button" class="h-9 px-3 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">Close</button>
      </div>
      <form id="editForm" class="p-5 space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Title</label>
          <input id="editTitle" type="text" class="w-full h-11 px-4 rounded-full bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Description</label>
          <textarea id="editDescription" rows="4" class="w-full p-4 rounded-ios-xl bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Tags (comma-separated)</label>
          <input id="editTags" type="text" class="w-full h-11 px-4 rounded-full bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all" placeholder="portrait, flux, remix" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Visibility</label>
          <select id="editVisibility" class="w-full h-11 px-4 rounded-full bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all">
            <option value="private">Private</option>
            <option value="unlisted">Unlisted</option>
            <option value="public">Public</option>
          </select>
          <div class="mt-2 text-xs text-muted-foreground">Public requires a claimed username.</div>
        </div>
        <div class="pt-2 flex items-center gap-2">
          <button id="editSaveBtn" type="submit" class="h-11 px-6 rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">
            Save
          </button>
          <button id="editCancelBtn" type="button" class="h-11 px-6 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Report modal -->
  <div id="reportModal" class="hidden fixed inset-0 z-50">
    <div id="reportModalBackdrop" class="absolute inset-0 bg-black/40"></div>
    <div class="absolute inset-x-0 top-20 mx-auto w-[min(560px,92vw)] rounded-ios-2xl border border-border bg-card shadow-xl overflow-hidden">
      <div class="p-4 border-b border-border flex items-center justify-between">
        <div class="font-semibold">Report creation</div>
        <button id="reportModalClose" type="button" class="h-9 px-3 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">Close</button>
      </div>
      <form id="reportForm" class="p-5 space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Reason</label>
          <select id="reportReason" class="w-full h-11 px-4 rounded-full bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all">
            <option value="nsfw">NSFW / Sexual content</option>
            <option value="spam">Spam</option>
            <option value="copyright">Copyright</option>
            <option value="hate">Hate / Harassment</option>
            <option value="violence">Violence</option>
            <option value="impersonation">Impersonation</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Details (optional)</label>
          <textarea id="reportDetails" rows="4" class="w-full p-4 rounded-ios-xl bg-secondary/80 border-0 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all" placeholder="Add context for moderators…"></textarea>
        </div>
        <div class="pt-2 flex items-center gap-2">
          <button id="reportSubmitBtn" type="submit" class="h-11 px-6 rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">
            Submit report
          </button>
          <button id="reportCancelBtn" type="button" class="h-11 px-6 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
