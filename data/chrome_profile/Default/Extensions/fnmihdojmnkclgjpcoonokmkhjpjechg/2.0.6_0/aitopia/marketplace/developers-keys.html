<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="Manage developer API keys for SDK and automation.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/aitopia/marketplace/favicon.svg">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">
  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">
  <script src="/aitopia/marketplace/js/inline/developers-keys-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/developers-keys-inline-2.js"></script>
</head>
<body data-page="developers-keys" class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-[260px_minmax(0,1fr)] gap-6">
      <aside id="developerSidebar"></aside>

      <section class="space-y-6 min-w-0">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">API Keys</h1>
          <p class="mt-2 text-sm text-muted-foreground">Generate and revoke keys for CLI and CI usage. Full key value is shown once.</p>
        </div>

        <div id="keysMessage" class="hidden rounded-xl border px-4 py-3 text-sm"></div>

        <div class="rounded-ios-2xl border border-border bg-card p-6">
          <h2 class="font-semibold">Create Key</h2>
          <form id="createKeyForm" class="mt-4 flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-[240px]">
              <label for="keyLabel" class="block text-sm font-semibold mb-2">Label</label>
              <input id="keyLabel" type="text" required class="w-full h-11 px-4 rounded-full bg-secondary/80 border-0 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/25" placeholder="production-key">
            </div>
            <button type="submit" class="h-11 px-6 rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">Generate Key</button>
          </form>

          <div id="generatedKeyWrap" class="hidden mt-4 rounded-xl border border-amber-300 bg-amber-50 text-amber-900 dark:border-amber-900/60 dark:bg-amber-950/40 dark:text-amber-200 p-4">
            <div class="text-sm font-semibold">Copy your new API key now</div>
            <code id="generatedKeyValue" class="block mt-2 text-xs break-all"></code>
            <button id="copyGeneratedKeyBtn" type="button" class="mt-3 h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">Copy</button>
          </div>
        </div>

        <div class="rounded-ios-2xl border border-border bg-card p-6">
          <h2 class="font-semibold">Active Keys</h2>
          <div id="keysList" class="mt-4 space-y-3"></div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/aitopia/marketplace/js/developers/keys.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
