<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <meta name="description" content="Run AppCore apps via /api/apps with optional async job polling.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <title> Smart Sidebar (AITOPIA)</title>
  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">

  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">

  <script src="/aitopia/marketplace/js/inline/app-runner-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/app-runner-inline-2.js"></script>
  <style>
    .runner-header code,
    .input-card code,
    .error code,
    .success code,
    details code,
    pre code {
      padding: 0.15rem 0.35rem;
      border-radius: 0.5rem;
      background: hsl(var(--aifnmjmchg-m-secondary) / 0.8);
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      font-size: 0.85em;
    }

    .field label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: hsl(var(--aifnmjmchg-m-muted-foreground));
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 44px;
      padding: 0.6rem 0.9rem;
      border-radius: 20px;
      background: hsl(var(--aifnmjmchg-m-secondary) / 0.8);
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      color: hsl(var(--aifnmjmchg-m-foreground));
      outline: none;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: hsl(var(--aifnmjmchg-m-primary) / 0.45);
      box-shadow: 0 0 0 3px hsl(var(--aifnmjmchg-m-primary) / 0.16);
    }

    .btn {
      height: 44px;
      padding: 0 1rem;
      border-radius: 9999px;
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      background: hsl(var(--aifnmjmchg-m-secondary) / 0.8);
      color: hsl(var(--aifnmjmchg-m-foreground));
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
      white-space: nowrap;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: hsl(var(--aifnmjmchg-m-secondary));
      border-color: hsl(var(--aifnmjmchg-m-primary) / 0.25);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled,
    .btn[aria-disabled="true"] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn.primary {
      background: hsl(var(--aifnmjmchg-m-primary));
      border-color: hsl(var(--aifnmjmchg-m-primary));
      color: hsl(var(--aifnmjmchg-m-primary-foreground));
    }

    .btn.primary:hover {
      background: hsl(var(--aifnmjmchg-m-primary) / 0.9);
      border-color: hsl(var(--aifnmjmchg-m-primary) / 0.9);
    }

    .apps-list {
      max-height: 70vh;
      overflow: auto;
    }

    .app-item {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid hsl(var(--aifnmjmchg-m-border));
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .app-item:hover {
      background: hsl(var(--aifnmjmchg-m-secondary) / 0.45);
    }

    .app-item.active {
      background: hsl(var(--aifnmjmchg-m-secondary));
    }

    .app-item .name {
      font-weight: 750;
    }

    .app-item .meta {
      color: hsl(var(--aifnmjmchg-m-muted-foreground));
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }

    .content {
      padding: 1.25rem;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 1024px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    .input-card {
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      background: hsl(var(--aifnmjmchg-m-card));
      border-radius: 20px;
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .input-card .title {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .input-card .title strong {
      font-size: 0.95rem;
      font-weight: 800;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      background: hsl(var(--aifnmjmchg-m-secondary) / 0.75);
      color: hsl(var(--aifnmjmchg-m-muted-foreground));
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge.req {
      background: rgba(255, 149, 0, 0.12);
      border-color: rgba(255, 149, 0, 0.35);
      color: rgb(160, 95, 0);
    }

    .dark .badge.req {
      color: rgb(255, 204, 0);
    }

    .hint {
      color: hsl(var(--aifnmjmchg-m-muted-foreground));
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .error,
    .success {
      padding: 0.95rem 1rem;
      border-radius: 20px;
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      background: hsl(var(--aifnmjmchg-m-secondary) / 0.25);
      margin-bottom: 1rem;
      white-space: pre-wrap;
    }

    .error {
      border-color: rgba(255, 59, 48, 0.35);
      background: rgba(255, 59, 48, 0.10);
      color: rgb(180, 40, 40);
    }

    .dark .error {
      color: rgb(255, 180, 180);
    }

    .success {
      border-color: rgba(52, 199, 89, 0.35);
      background: rgba(52, 199, 89, 0.10);
      color: rgb(20, 120, 60);
    }

    .dark .success {
      color: rgb(180, 255, 205);
    }

    .result-media {
      margin-top: 0.75rem;
    }

    .result-media img,
    .result-media video {
      max-width: 100%;
      border-radius: 20px;
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      background: #000;
    }

    .result-media audio {
      width: 100%;
    }

    details {
      border: 1px solid hsl(var(--aifnmjmchg-m-border));
      border-radius: 20px;
      padding: 0.9rem 1rem;
      background: hsl(var(--aifnmjmchg-m-secondary) / 0.18);
    }

    details summary {
      cursor: pointer;
      color: hsl(var(--aifnmjmchg-m-muted-foreground));
      font-weight: 700;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.85rem;
      color: hsl(var(--aifnmjmchg-m-foreground));
      margin-top: 0.75rem;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-8">
    <div class="runner-header rounded-ios-3xl border border-border bg-card p-6 shadow-sm">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div class="min-w-0">
          <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">App Runner</h1>
          <p class="mt-2 text-sm text-muted-foreground">
            Run AppCore apps via <code>/api/apps</code> and optionally poll jobs via <code>/jobs</code>. Uses <code>window.location.origin</code> for the API base.
          </p>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <a href="/aitopia/marketplace/app-studio.html" class="h-11 px-5 inline-flex items-center justify-center rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
            Open App Studio
          </a>
          <a href="/aitopia/marketplace/app-builder.html" class="h-11 px-5 inline-flex items-center justify-center rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">
            Edit JSON
          </a>
        </div>
      </div>

      <div class="mt-6 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="field">
          <label for="tenantId">Tenant</label>
          <input id="tenantId" placeholder="public" value="public" />
        </div>
        <div class="field">
          <label for="userId">User ID (optional)</label>
          <input id="userId" placeholder="u1" />
        </div>
        <div class="field">
          <label for="userTier">Tier (optional)</label>
          <select id="userTier">
            <option value="">(auto)</option>
            <option value="free">free</option>
            <option value="starter">starter</option>
            <option value="pro">pro</option>
            <option value="enterprise">enterprise</option>
          </select>
        </div>
        <div class="field">
          <label for="asyncMode">Run Mode</label>
          <select id="asyncMode">
            <option value="auto">(auto)</option>
            <option value="true">async wrapper (jobs table)</option>
            <option value="false">sync (immediate response)</option>
          </select>
        </div>
      </div>

      <div class="mt-4 flex flex-wrap items-center gap-2">
        <button id="refreshBtn" class="btn primary" type="button">Refresh Apps</button>
      </div>
    </div>

    <div class="mt-6 grid grid-cols-1 lg:grid-cols-[340px,1fr] gap-6 items-start">
      <div class="rounded-ios-2xl border border-border bg-card overflow-hidden">
        <div class="px-5 py-4 border-b border-border flex items-center justify-between">
          <h2 class="text-sm font-semibold">Apps</h2>
          <span id="appsMeta" class="badge">0</span>
        </div>
        <div id="appsList" class="apps-list"></div>
      </div>

      <div class="rounded-ios-2xl border border-border bg-card overflow-hidden">
        <div class="px-5 py-4 border-b border-border flex items-center justify-between gap-4">
          <h2 id="detailTitle" class="text-sm font-semibold truncate">Select an app</h2>
          <div class="flex items-center gap-2 flex-wrap justify-end">
            <button id="runBtn" class="btn primary" type="button" disabled>Generate</button>
            <button id="stopBtn" class="btn" type="button" disabled>Stop Polling</button>
          </div>
        </div>
        <div class="p-5 sm:p-6">
          <div id="statusBox"></div>
          <div id="inputsBox"></div>
          <div id="resultBox"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/aitopia/marketplace/js/inline/app-runner-inline-3.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
