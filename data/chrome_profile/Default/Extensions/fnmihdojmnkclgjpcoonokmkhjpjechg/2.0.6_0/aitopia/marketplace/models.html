<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>
  



  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="Browse AI models from Google, Black Forest Labs, Stability AI, ByteDance, NVIDIA and more. Run models directly in your browser.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  
  <!-- Shared Styles -->
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">
  <script src="/aitopia/marketplace/js/inline/models-inline-2.js"></script>
  <style>
    .spinner { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .card-hover {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .img-zoom {
      transition: transform 0.3s ease;
    }
    .group:hover .img-zoom {
      transform: scale(1.05);
    }

    .gradient-fallback {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .sidebar-scroll {
      scrollbar-width: thin;
      scrollbar-color: hsl(var(--aifnmjmchg-m-muted)) transparent;
    }
    .sidebar-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .sidebar-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: hsl(var(--aifnmjmchg-m-muted));
      border-radius: 3px;
    }

    .filter-checkbox {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid hsl(var(--aifnmjmchg-m-muted-foreground));
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      position: relative;
    }
    .filter-checkbox:checked {
      background: hsl(var(--aifnmjmchg-m-primary));
      border-color: hsl(var(--aifnmjmchg-m-primary));
    }
    .filter-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .filter-radio {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid hsl(var(--aifnmjmchg-m-muted-foreground));
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      position: relative;
    }
    .filter-radio:checked {
      border-color: hsl(var(--aifnmjmchg-m-primary));
    }
    .filter-radio:checked::after {
      content: '';
      position: absolute;
      left: 3px;
      top: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: hsl(var(--aifnmjmchg-m-primary));
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease forwards;
    }

  </style>
  <script src="/aitopia/marketplace/js/inline/models-inline-3.js"></script>
</head>
<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">



  <!-- Navbar Component -->
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <!-- Main Layout -->
	  <div class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-6">
	    <div class="flex gap-8">
      <!-- Desktop Sidebar -->
      <aside class="hidden md:block w-64 flex-shrink-0">
        <div class="sticky top-2 space-y-2">
          <!-- Search -->
          <input type="text" id="search-input" class="sr-only" aria-hidden="true" tabindex="-1">

          <!-- Type Filters -->
          <div>
            <h3 class="font-semibold text-sm mb-3">Type</h3>
            <div class="space-y-2" id="type-filters">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="type" value="" id="type-all" class="filter-radio" checked>
                <span class="text-sm">All Models</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="type" value="image" id="type-image" class="filter-radio">
                <span class="text-sm">🖼️ Image</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="type" value="video" id="type-video" class="filter-radio">
                <span class="text-sm">🎬 Video</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="type" value="audio" id="type-audio" class="filter-radio">
                <span class="text-sm">🎵 Audio</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="type" value="text" id="type-text" class="filter-radio">
                <span class="text-sm">📝 Text & Vision</span>
              </label>
            </div>
          </div>

          <!-- Provider List -->
          <div class="!mt-6">
            <h3 class="font-semibold text-sm mb-3">Providers</h3>
            <nav id="provider-list" class="space-y-2 max-h-[500px] overflow-y-auto sidebar-scroll">
              <div class="text-center py-4 text-muted-foreground text-sm">Loading...</div>
            </nav>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 min-w-0">
        <div id="main-content">
          <!-- Content loaded dynamically -->
          <div class="text-center py-20">
            <div class="spinner w-8 h-8 border-2 border-primary border-t-transparent rounded-full mx-auto mb-4"></div>
            <p class="text-muted-foreground">Loading models...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/aitopia/marketplace/js/inline/models-inline-4.js"></script>

  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
