<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="AI models from top providers">

  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">

  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  
  <script src="/aitopia/marketplace/js/inline/owner-inline-1.js"></script>
  
  <style>
    :root {
      --aifnmjmchg-m-background: 0 0% 100%;
      --aifnmjmchg-m-foreground: 0 0% 3.9%;
      --aifnmjmchg-m-card: 0 0% 100%;
      --aifnmjmchg-m-card-foreground: 0 0% 3.9%;
      --aifnmjmchg-m-popover: 0 0% 100%;
      --aifnmjmchg-m-popover-foreground: 0 0% 3.9%;
      --aifnmjmchg-m-primary: 0 0% 0%;
      --aifnmjmchg-m-primary-foreground: 210 40% 98%;
      --aifnmjmchg-m-secondary: 0 0% 100%;
      --aifnmjmchg-m-secondary-foreground: 222.2 47.4% 11.2%;
      --aifnmjmchg-m-muted: 210 40% 96.1%;
      --aifnmjmchg-m-muted-foreground: 215.4 16.3% 46.9%;
      --aifnmjmchg-m-accent: 210 40% 96.1%;
      --aifnmjmchg-m-accent-foreground: 222.2 47.4% 11.2%;
      --aifnmjmchg-m-destructive: 0 84.2% 60.2%;
      --aifnmjmchg-m-border: 214.3 31.8% 91.4%;
      --aifnmjmchg-m-input: 214.3 31.8% 91.4%;
      --aifnmjmchg-m-ring: 260 79% 59%;
    }

    .dark {
      --aifnmjmchg-m-background: 0 0% 3.9%;
      --aifnmjmchg-m-foreground: 0 0% 98%;
      --aifnmjmchg-m-card: 0 0% 7%;
      --aifnmjmchg-m-card-foreground: 0 0% 98%;
      --aifnmjmchg-m-popover: 0 0% 7%;
      --aifnmjmchg-m-popover-foreground: 0 0% 98%;
      --aifnmjmchg-m-primary: 0 0% 100%;
      --aifnmjmchg-m-primary-foreground: 0 0% 0%;
      --aifnmjmchg-m-secondary: 0 0% 0%;
      --aifnmjmchg-m-secondary-foreground: 210 40% 98%;
      --aifnmjmchg-m-muted: 217.2 32.6% 17.5%;
      --aifnmjmchg-m-muted-foreground: 215 20.2% 65.1%;
      --aifnmjmchg-m-accent: 217.2 32.6% 17.5%;
      --aifnmjmchg-m-accent-foreground: 210 40% 98%;
      --aifnmjmchg-m-destructive: 0 62.8% 30.6%;
      --aifnmjmchg-m-border: 217.2 32.6% 17.5%;
      --aifnmjmchg-m-input: 217.2 32.6% 17.5%;
      --aifnmjmchg-m-ring: 260 79% 59%;
    }

    * { -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(var(--aifnmjmchg-m-muted-foreground) / 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(var(--aifnmjmchg-m-muted-foreground) / 0.5); }
    .glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }
    .dark .glass { background: rgba(28, 28, 30, 0.72); }
    .btn-press { transition: transform 0.1s ease; }
    .btn-press:active { transform: scale(0.96); }
  </style>
  
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">
  <script src="/aitopia/marketplace/js/inline/owner-inline-2.js"></script>
</head>
<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">

  <!-- Navbar Component -->
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-6">
    <!-- Loading State -->
    <div id="loadingState" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin h-10 w-10 border-4 border-primary border-t-transparent rounded-full mb-4"></div>
      <p class="text-muted-foreground">Loading models...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden flex flex-col items-center justify-center py-20">
      <div class="w-16 h-16 rounded-full bg-destructive/20 flex items-center justify-center mb-4">
        <svg class="w-8 h-8 text-destructive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
      </div>
      <h2 class="text-xl font-semibold mb-2">No Models Found</h2>
      <p id="errorMessage" class="text-muted-foreground mb-4">No models found for this owner.</p>
      <a href="/aitopia/marketplace/models.html" class="px-4 py-2 bg-primary hover:bg-primary/90 rounded-ios-lg text-sm font-medium text-primary-foreground transition-colors">Browse All Models</a>
    </div>

    <!-- Content -->
    <div id="content" class="hidden">
      <!-- Breadcrumb -->
      <nav class="mb-6" aria-label="Breadcrumb">
        <ol class="flex items-center gap-2 text-sm text-muted-foreground">
          <li><a href="/aitopia/marketplace/models.html" class="hover:text-foreground transition-colors">Models</a></li>
          <li class="flex items-center gap-2">
            <svg class="w-4 h-4 text-muted-foreground/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-width="2" stroke-linecap="round" d="M9 5l7 7-7 7"/>
            </svg>
            <span id="breadcrumbOwner" class="text-foreground font-medium">Owner</span>
          </li>
        </ol>
      </nav>

      <!-- Owner Header -->
      <header class="mb-6">
        <div class="flex items-center gap-4 mb-2">
          <div id="ownerIcon" class="w-14 h-14 rounded-xl bg-gradient-to-br from-primary/90 to-indigo-600 flex items-center justify-center flex-shrink-0 text-2xl font-bold shadow-lg shadow-primary/90/20">
            G
          </div>
          <div class="flex-1">
            <div class="flex items-center justify-between">
              <h1 id="ownerName" class="text-2xl font-bold capitalize">Owner</h1>
              <span id="modelCount" class="text-sm text-muted-foreground">0 models</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Category Filter Tabs -->
      <div class="mb-6 border-b border-border">
        <div class="flex items-center gap-1 overflow-x-auto pb-px hide-scrollbar">
          <button data-filter="all" class="filter-tab active px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 border-transparent transition-colors">
            All Models
          </button>
          <button data-filter="image" class="filter-tab px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 border-transparent transition-colors">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
              Image
            </span>
          </button>
          <button data-filter="video" class="filter-tab px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 border-transparent transition-colors">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
              </svg>
              Video
            </span>
          </button>
          <button data-filter="audio" class="filter-tab px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 border-transparent transition-colors">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"/>
              </svg>
              Audio
            </span>
          </button>
          <button data-filter="text" class="filter-tab px-4 py-3 text-sm font-medium whitespace-nowrap border-b-2 border-transparent transition-colors">
            <span class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
              </svg>
              Text
            </span>
          </button>
        </div>
      </div>

      <!-- Additional Filters -->
      <div class="flex flex-wrap gap-3 mb-6">
        <div class="flex items-center gap-2 ml-auto text-sm text-muted-foreground">
          <span id="filteredCount">0</span> models
        </div>
      </div>

      <!-- Models Grid - 3 columns -->
      <div id="modelsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Models will be inserted here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-16">
        <div class="w-16 h-16 rounded-full bg-muted flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </div>
        <h3 class="text-lg font-semibold mb-2">No models match your filters</h3>
        <p class="text-muted-foreground mb-4">Try adjusting your filter criteria</p>
        <button data-action="resetFilters" class="text-primary hover:text-primary/80 text-sm font-medium">Clear all filters</button>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/10 mt-16">
    <div class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-12">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <a href="/aitopia/marketplace/models.html" class="text-primary/90 hover:text-primary/90 transition-colors">&larr; All Model Providers</a>
        <p class="text-sm text-gray-500">&copy; 2026 AITOPIA. All rights reserved.</p>
      </div>
    </div>
  </footer>

<style>
  .filter-tab {
    color: hsl(var(--aifnmjmchg-m-muted-foreground));
    border-color: transparent;
  }
  .filter-tab:hover {
    color: hsl(var(--aifnmjmchg-m-foreground));
  }
  .filter-tab.active {
    color: hsl(var(--aifnmjmchg-m-primary));
    border-color: hsl(var(--aifnmjmchg-m-primary));
  }

  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  .model-card {
    transition: all 0.2s ease;
  }
  .model-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px -12px rgba(168, 85, 247, 0.2);
  }
  .model-card:hover .model-image {
    transform: scale(1.02);
  }

  .model-image {
    transition: transform 0.3s ease;
  }

  /* Video preview on hover */
  .model-card video {
    opacity: 0.9;
  }
  .model-card:hover video {
    opacity: 1;
  }
</style>

<script src="/aitopia/marketplace/js/inline/owner-inline-3.js"></script>

  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
