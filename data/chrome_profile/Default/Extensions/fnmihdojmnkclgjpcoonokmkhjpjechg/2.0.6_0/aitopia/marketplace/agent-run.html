<!DOCTYPE html>
<html lang="en">
  <head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title> Smart Sidebar (AITOPIA)</title>
    <link rel="icon" href="/aitopia/marketplace/favicon.ico" />
    <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
    <script src="/aitopia/marketplace/js/inline/agent-run-inline-1.js"></script>
    <script src="/aitopia/marketplace/js/inline/agent-run-inline-2.js"></script>
    <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet" />
  </head>
  <body class="bg-white text-gray-900 dark:bg-neutral-950 dark:text-white min-h-screen font-sans aifnmjmchg aifnmjmchg-marketplace">
    <header class="sticky top-0 z-50 backdrop-blur border-b border-black/5 dark:border-white/10 bg-white/80 dark:bg-neutral-950/70">
      <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="/aitopia/marketplace/home.html" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-ios bg-gradient-to-br from-primary/90 to-indigo-600 flex items-center justify-center">
              <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
              </svg>
            </div>
            <span class="font-semibold tracking-tight">AITOPIA</span>
          </a>
          <span class="text-sm text-gray-400 hidden sm:inline">Agent Runner</span>
        </div>

        <div class="flex items-center gap-3">
          <a id="backLink" href="/aitopia/marketplace/home.html" class="text-sm text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
            ← Back to agent
          </a>
          <a
            id="legacyLink"
            href="/aitopia/marketplace/home.html"
            class="text-sm text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white underline underline-offset-4"
            title="Fallback to legacy runner (store.html)"
          >
            Legacy runner
          </a>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
      <div id="loading" class="py-20 text-center">
        <div class="mx-auto w-10 h-10 border-4 border-primary/90/40 border-t-primary/90 rounded-full animate-spin mb-4"></div>
        <p class="text-gray-500 dark:text-gray-400">Loading agent…</p>
      </div>

      <div id="error" class="hidden py-20 text-center">
        <div class="mx-auto w-12 h-12 rounded-full bg-red-500/10 text-red-600 dark:text-red-400 flex items-center justify-center mb-4">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1 class="text-xl font-semibold mb-2">Unable to load agent</h1>
        <p id="errorMessage" class="text-gray-500 dark:text-gray-400 mb-6"></p>
        <a href="/aitopia/marketplace/agents.html" class="inline-flex items-center justify-center h-11 px-5 rounded-full bg-primary/90 text-primary-foreground hover:bg-primary/90">
          Browse agents
        </a>
      </div>

      <div id="content" class="hidden">
        <div class="flex items-start gap-4 mb-8">
          <img id="agentIcon" class="w-16 h-16 rounded-ios-xl object-cover bg-neutral-200 dark:bg-neutral-800" alt="" />
          <div class="min-w-0">
            <h1 id="agentName" class="text-2xl font-bold leading-tight"></h1>
            <p id="agentDescription" class="text-gray-600 dark:text-gray-400 mt-1"></p>
            <div id="agentMeta" class="text-sm text-gray-500 dark:text-gray-400 mt-3 flex flex-wrap gap-x-4 gap-y-1"></div>
          </div>
        </div>

        <section id="agentExamples" class="hidden mb-8">
          <div id="agentExamplesMain" class="aspect-video rounded-ios-2xl overflow-hidden bg-neutral-100 dark:bg-neutral-900"></div>
          <div id="agentExamplesThumbs" class="hidden mt-3 flex gap-3 overflow-x-auto pb-2 hide-scrollbar"></div>
        </section>

        <div class="grid lg:grid-cols-2 gap-8">
          <section class="rounded-ios-2xl border border-black/5 dark:border-white/10 bg-white dark:bg-neutral-900/30 p-6">
            <div class="flex items-center justify-between gap-3 mb-4">
              <h2 class="font-semibold">Input</h2>
              <div id="modelChooser" class="hidden">
                <label class="text-xs text-gray-500 dark:text-gray-400 mr-2">Model</label>
                <select
                  id="modelSelect"
                  class="text-sm px-3 py-2 rounded-ios-lg bg-white dark:bg-neutral-900 border border-black/10 dark:border-white/10"
                ></select>
              </div>
            </div>
            <div id="formContainer"></div>
            <button
              id="runButton"
              type="button"
              class="mt-6 w-full h-12 rounded-full bg-primary/90 text-primary-foreground font-semibold hover:bg-primary/90 disabled:opacity-60 disabled:cursor-not-allowed"
            >
              Run
            </button>
            <p id="runHint" class="mt-3 text-xs text-gray-500 dark:text-gray-400"></p>
          </section>

          <section class="rounded-ios-2xl border border-black/5 dark:border-white/10 bg-white dark:bg-neutral-900/30 p-6">
            <div class="flex items-center justify-between gap-3 mb-4">
              <h2 class="font-semibold">Result</h2>
              <div id="statusPill" class="hidden text-xs px-3 py-1 rounded-full bg-neutral-100 text-neutral-700 dark:bg-neutral-800 dark:text-neutral-200"></div>
            </div>
            <div id="outputContainer" class="min-h-[200px] flex items-center justify-center text-gray-500 dark:text-gray-400">
              Run the agent to see results.
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="/aitopia/marketplace/js/shared/fetch-helper.js"></script>
    <script src="/aitopia/marketplace/js/shared/cache.js"></script>
    <script src="/aitopia/marketplace/js/shared/credits.js"></script>
    <script type="module" src="/aitopia/marketplace/js/runner/runner.js"></script>
    <style>
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  <script src="/aitopia/marketplace/js/inline/agent-run-inline-3.js"></script>
</body>
</html>
