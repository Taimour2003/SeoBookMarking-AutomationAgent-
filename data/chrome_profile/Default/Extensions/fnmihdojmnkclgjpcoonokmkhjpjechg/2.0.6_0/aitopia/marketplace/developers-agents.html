<html lang="en" class="scroll-smooth">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="Track your agent submissions and published agents.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/aitopia/marketplace/favicon.svg">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">
  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">
  <script src="/aitopia/marketplace/js/inline/developers-agents-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/developers-agents-inline-2.js"></script>
</head>
<body data-page="developers-agents" class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-[260px_minmax(0,1fr)] gap-6">
      <aside id="developerSidebar"></aside>

      <section class="space-y-6 min-w-0">
        <div class="flex items-start justify-between gap-4 flex-wrap">
          <div>
            <h1 class="text-3xl font-bold tracking-tight">My Agents</h1>
            <p class="mt-2 text-sm text-muted-foreground">Review queue status and published partner agents.</p>
          </div>
          <div class="flex items-center gap-2">
            <button id="refreshAgentsBtn" type="button" class="h-10 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-semibold transition-colors">Refresh</button>
            <a href="/aitopia/marketplace/developers-agents-submit.html" class="h-10 px-4 inline-flex items-center justify-center rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">Submit New Agent</a>
          </div>
        </div>

        <div id="agentsMessage" class="hidden rounded-xl border px-4 py-3 text-sm"></div>

        <div class="rounded-ios-2xl border border-border bg-card p-6">
          <h2 class="font-semibold">Submission Queue</h2>
          <div id="submissionList" class="mt-4 space-y-3"></div>
        </div>

        <div class="rounded-ios-2xl border border-border bg-card p-6">
          <h2 class="font-semibold">Registered Agents</h2>
          <div id="publishedAgentsList" class="mt-4 space-y-3"></div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/aitopia/marketplace/js/developers/agents.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
