<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>
  



  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="View a creator profile and their creations.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">

  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">

  <style>
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 640px) {
      .profile-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 1024px) {
      .profile-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1280px) {
      .profile-grid { grid-template-columns: repeat(5, 1fr); }
    }

    .profile-header-gradient {
      background: #F2ECFD;
    }
  </style>

  <script src="/aitopia/marketplace/js/inline/profile-inline-2.js"></script>
  <script src="/aitopia/marketplace/js/inline/profile-inline-3.js"></script>
</head>

<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">


  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="errorBanner" class="hidden rounded-2xl border border-red-500/20 bg-red-500/10 p-4 text-sm text-red-500 mb-6"></div>

    <section class="rounded-2xl border border-border bg-card overflow-hidden">
      <div class="h-24 sm:h-32 profile-header-gradient"></div>

      <div class="px-4 sm:px-6 pb-6">
        <div class="-mt-12 sm:-mt-14 mb-4">
          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-card border-4 border-card overflow-hidden flex items-center justify-center">
            <img id="avatar" class="w-full h-full object-cover hidden" alt="" />
            <div id="avatarFallback" class="w-full h-full bg-primary flex items-center justify-center text-2xl sm:text-3xl font-bold text-white">@</div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h1 id="username" class="text-xl sm:text-2xl font-bold tracking-tight">@user</h1>
            </div>
            <div id="displayName" class="mt-1 text-sm text-muted-foreground hidden"></div>
            <p id="bio" class="mt-3 text-sm text-foreground/80 whitespace-pre-wrap max-w-lg"></p>
            <a id="website" class="mt-2 inline-flex items-center gap-1.5 text-sm text-primary hover:underline hidden" target="_blank" rel="noreferrer">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
              <span id="websiteText"></span>
            </a>
          </div>

          <div class="flex items-center gap-2">
            <a id="editProfileBtn" href="/aitopia/marketplace/settings-profile.html" class="hidden h-10 px-5 items-center justify-center rounded-full border border-border hover:bg-secondary text-sm font-medium transition-colors">
              Edit profile
            </a>
            <button id="followBtn" type="button" class="hidden h-10 px-6 rounded-full bg-primary text-primary-foreground text-sm font-semibold hover:bg-primary/90 transition-colors">
              Follow
            </button>
          </div>
        </div>

        <div class="mt-6 flex items-center gap-6">
          <button id="statCreations" type="button" class="group text-left hover:opacity-80 transition-opacity">
            <span id="countCreations" class="text-lg font-bold">0</span>
            <span class="text-sm text-muted-foreground ml-1">Creations</span>
          </button>
          <button id="statFollowers" type="button" class="group text-left hover:opacity-80 transition-opacity">
            <span id="countFollowers" class="text-lg font-bold">0</span>
            <span class="text-sm text-muted-foreground ml-1">Followers</span>
          </button>
          <button id="statFollowing" type="button" class="group text-left hover:opacity-80 transition-opacity">
            <span id="countFollowing" class="text-lg font-bold">0</span>
            <span class="text-sm text-muted-foreground ml-1">Following</span>
          </button>
        </div>
      </div>
    </section>

    <section class="mt-6">
      <div class="flex items-center gap-1 border-b border-border">
        <button id="tabCreations" type="button" class="px-4 py-3 text-sm font-medium border-b-2 border-primary text-foreground">Creations</button>
        <button id="tabRemixes" type="button" class="px-4 py-3 text-sm font-medium border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-colors">Remixes</button>
        <button id="tabHistory" type="button" class="hidden px-4 py-3 text-sm font-medium border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-colors">History</button>
        <button id="tabPrivate" type="button" class="hidden px-4 py-3 text-sm font-medium border-b-2 border-transparent text-muted-foreground hover:text-foreground transition-colors">Private</button>
      </div>

      <div id="historyFilters" class="hidden mt-4 flex flex-wrap items-center gap-2">
        <label class="inline-flex items-center gap-2 rounded-full bg-secondary px-4 py-2">
          <span class="text-xs text-muted-foreground">Type</span>
          <select id="historyType" class="bg-transparent text-sm font-semibold focus:outline-none cursor-pointer">
            <option value="all">All</option>
            <option value="image">Images</option>
            <option value="video">Videos</option>
            <option value="audio">Audio</option>
          </select>
        </label>
      </div>

      <div id="grid" class="mt-6 profile-grid"></div>

      <div id="emptyState" class="hidden mt-14 text-center py-12">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-secondary/50 flex items-center justify-center text-3xl">
          <svg class="w-8 h-8 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </div>
        <h2 id="emptyTitle" class="mt-4 text-lg font-semibold">Nothing here yet</h2>
        <p id="emptySubtitle" class="mt-1 text-sm text-muted-foreground max-w-sm mx-auto">When this user publishes creations or remixes, they'll appear here.</p>
      </div>

      <div id="scrollSentinel" class="h-1"></div>
      <div class="mt-8 flex justify-center">
        <button id="loadMore" type="button" class="hidden h-10 px-6 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-medium transition-colors">
          Load more
        </button>
      </div>
    </section>
  </main>

  <!-- Followers/Following modal -->
  <div id="followModal" class="hidden fixed inset-0 z-50">
    <div id="followModalBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="absolute inset-x-0 top-[10vh] mx-auto w-[min(480px,92vw)] rounded-2xl border border-border bg-card shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-border flex items-center justify-between">
        <h3 id="followModalTitle" class="font-semibold text-lg">Followers</h3>
        <button id="followModalClose" type="button" class="w-8 h-8 rounded-full hover:bg-secondary flex items-center justify-center transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="followModalBody" class="max-h-[60vh] overflow-auto p-2"></div>
      <div id="followModalFooter" class="p-3 border-t border-border flex justify-center">
        <button id="followModalLoadMore" type="button" class="hidden h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-medium transition-colors">Load more</button>
      </div>
    </div>
  </div>

  <!-- History detail modal -->
  <div id="historyModal" class="hidden fixed inset-0 z-50">
    <div id="historyModalBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="absolute inset-x-0 top-[5vh] mx-auto w-[min(720px,94vw)] rounded-2xl border border-border bg-card shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-border flex items-center justify-between gap-3">
        <div class="min-w-0">
          <h3 class="font-semibold text-lg">History Details</h3>
          <p id="historyModalSubtitle" class="text-sm text-muted-foreground mt-0.5 truncate"></p>
        </div>
        <div class="flex items-center gap-2">
          <button id="historyCopyBtn" type="button" class="h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-medium transition-colors">Copy JSON</button>
          <button id="historyModalClose" type="button" class="w-9 h-9 rounded-full hover:bg-secondary flex items-center justify-center transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="historyModalBody" class="max-h-[75vh] overflow-auto p-5 space-y-4"></div>
    </div>
  </div>

  <!-- Creation detail modal -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden font-sans bg-background">
    <div class="h-full flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden">
      <!-- Mobile header bar -->
      <div class="lg:hidden flex items-center gap-2 px-3 py-2 bg-card border-b border-border flex-shrink-0">
        <button id="modalCloseMobile" type="button" class="h-9 w-9 flex items-center justify-center rounded-full hover:bg-secondary transition-colors">
          <svg class="w-5 h-5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div id="modalAvatarMobile" class="w-7 h-7 rounded-full bg-primary flex items-center justify-center text-primary-foreground font-bold text-xs flex-shrink-0">A</div>
        <div class="flex-1 min-w-0">
          <div id="modalAuthorNameMobile" class="text-foreground font-medium text-sm truncate">Anonymous</div>
        </div>
      </div>
      <div id="modalMediaArea" class="order-2 lg:order-none relative flex items-center justify-center bg-gray-100 dark:bg-black flex-shrink-0 min-h-[200px] lg:max-h-none lg:min-h-0 lg:flex-1 lg:overflow-hidden">
        <div id="modalMedia" class="w-full lg:h-full flex items-center justify-center"></div>
      </div>
      <!-- Right column wrapper-->
      <div class="contents lg:w-[400px] lg:flex lg:flex-col lg:flex-shrink-0 lg:max-h-full lg:h-full lg:overflow-hidden lg:border-l lg:border-border">
        <!-- Details Panel (order-1 = first on mobile) -->
        <div class="order-1 lg:order-none w-full bg-card flex flex-col lg:overflow-hidden border-t lg:border-t-0">
          <div class="hidden lg:flex items-center gap-3 px-4 py-3 border-b border-border">
            <div id="modalAvatar" class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-bold text-sm flex-shrink-0">A</div>
            <div class="flex-1 min-w-0">
              <div id="modalAuthorName" class="text-foreground font-semibold text-sm truncate"></div>
            </div>
            <button id="modalClose" type="button" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-secondary transition-colors">
              <svg class="w-5 h-5 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="lg:flex-1 lg:overflow-y-auto">
            <div id="modalTransitionPreview" class="hidden">
              <div class="relative w-full h-32 overflow-hidden">
                <video id="modalTransitionVideo" class="absolute inset-0 w-full h-full object-cover" autoplay muted loop playsinline></video>
                <div class="absolute inset-0 bg-black/40 flex items-center justify-center">
                  <span id="modalTransitionType" class="text-2xl font-black italic uppercase tracking-wide text-primary/90"></span>
                </div>
              </div>
            </div>

            <div class="p-4 border-b border-border">
              <div class="flex items-center justify-between mb-2">
                <span class="text-muted-foreground text-xs font-semibold uppercase tracking-wider">Prompt</span>
                <button id="modalCopyPrompt" type="button" class="px-3 py-1 rounded-full bg-secondary hover:bg-secondary/80 text-foreground text-xs font-medium transition-colors">Copy</button>
              </div>
              <p id="modalPrompt" class="text-foreground text-sm leading-relaxed">No prompt available</p>
              <div id="modalInputMedia" class="hidden mt-4">
                <div id="modalInputMediaGrid" class="grid grid-cols-2 gap-2"></div>
              </div>
            </div>
            <div class="p-4">
              <div class="text-muted-foreground text-xs font-semibold uppercase tracking-wider mb-3">Information</div>
              <div id="modalInfoRows" class="space-y-0"></div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="order-3 lg:order-none w-full bg-card flex-shrink-0 p-4 pb-[calc(1rem+env(safe-area-inset-bottom,0px))] border-t border-border space-y-2">
          <div id="modalTopActions" class="grid grid-cols-1 gap-2">
            <a id="modalRecreate" href="#" class="h-11 flex items-center justify-center gap-2 rounded-full bg-primary hover:bg-primary/90 text-primary-foreground text-sm font-semibold transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              Remix
            </a>
            <button id="modalPublish" type="button" class="hidden h-11 items-center justify-center gap-2 rounded-full bg-primary hover:bg-primary/90 text-primary-foreground text-sm font-semibold transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z"/>
              </svg>
              Publish
            </button>
          </div>
          <button id="modalDownload" type="button" class="w-full h-10 flex items-center justify-center gap-2 rounded-full bg-secondary hover:bg-secondary/80 text-foreground text-sm font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Download
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/aitopia/marketplace/js/shared/fetch-helper.js"></script>
  <script type="module" src="/aitopia/marketplace/js/profile/profile.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
