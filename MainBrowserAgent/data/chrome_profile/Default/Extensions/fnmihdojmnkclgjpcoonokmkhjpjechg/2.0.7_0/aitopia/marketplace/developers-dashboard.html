<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="Developer dashboard for partner profile, agents, and earnings.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/aitopia/marketplace/favicon.svg">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">
  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">
  <script src="/aitopia/marketplace/js/inline/developers-dashboard-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/developers-dashboard-inline-2.js"></script>
</head>
<body data-page="developers-dashboard" class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-[1600px] mx-auto px-3 sm:px-4 lg:px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-[260px_minmax(0,1fr)] gap-6">
      <aside id="developerSidebar"></aside>

      <section class="space-y-6 min-w-0">
        <div>
          <h1 class="text-3xl font-bold tracking-tight">Developer Dashboard</h1>
          <p class="mt-2 text-sm text-muted-foreground">Welcome back <span id="developerName" class="font-semibold">Developer</span>. Namespace: <span id="developerNamespace" class="font-semibold">dev.namespace.*</span></p>
        </div>

        <div id="dashboardMessage" class="hidden rounded-xl border px-4 py-3 text-sm"></div>

        <div class="grid grid-cols-2 xl:grid-cols-3 gap-4">
          <div class="rounded-ios-2xl border border-border bg-card p-5"><div class="text-xs text-muted-foreground">Total Runs</div><div id="statRuns" class="mt-1 text-2xl font-extrabold">0</div></div>
          <div class="rounded-ios-2xl border border-border bg-card p-5"><div class="text-xs text-muted-foreground">All-Time Earned</div><div id="statEarned" class="mt-1 text-2xl font-extrabold">0</div></div>
          <div class="rounded-ios-2xl border border-border bg-card p-5"><div class="text-xs text-muted-foreground">Available</div><div id="statAvailable" class="mt-1 text-2xl font-extrabold">0</div></div>
          <div class="rounded-ios-2xl border border-border bg-card p-5"><div class="text-xs text-muted-foreground">Escrowed</div><div id="statEscrowed" class="mt-1 text-2xl font-extrabold">0</div></div>
          <div class="rounded-ios-2xl border border-border bg-card p-5"><div class="text-xs text-muted-foreground">Active Agents</div><div id="statAgents" class="mt-1 text-2xl font-extrabold">0</div></div>
          <div class="rounded-ios-2xl border border-border bg-card p-5"><div class="text-xs text-muted-foreground">Pending Review</div><div id="statPending" class="mt-1 text-2xl font-extrabold">0</div></div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
          <div class="rounded-ios-2xl border border-border bg-card p-5">
            <div class="flex items-center justify-between gap-3 mb-3">
              <h2 class="font-semibold">Recent Agents</h2>
              <a href="/aitopia/marketplace/developers-agents.html" class="text-xs text-primary font-semibold">View all</a>
            </div>
            <div id="recentAgents" class="space-y-3"></div>
          </div>
          <div class="rounded-ios-2xl border border-border bg-card p-5">
            <div class="flex items-center justify-between gap-3 mb-3">
              <h2 class="font-semibold">Recent Submissions</h2>
              <a href="/aitopia/marketplace/developers-agents-submit.html" class="text-xs text-primary font-semibold">Submit</a>
            </div>
            <div id="recentSubmissions" class="space-y-3"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/aitopia/marketplace/js/developers/dashboard.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
