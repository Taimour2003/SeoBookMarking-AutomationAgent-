<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<script src="/aitopia/marketplace/js/extension-config.js"></script>
  <script src="/aitopia/marketplace/js/shared/pre-auth.js"></script>


  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <base href="/aitopia/marketplace/home.html">
  <title> Smart Sidebar (AITOPIA)</title>
  <meta name="description" content="Customize your profile and claim your username.">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="/aitopia/marketplace/favicon.ico">
  <link href="/aitopia/marketplace/css/vendor/css2.css" rel="stylesheet">

  <script src="/aitopia/marketplace/js/vendor/tailwindcss.min.js"></script>
  <script src="/aitopia/marketplace/store/tailwind-config.js"></script>
  <link rel="stylesheet" href="/aitopia/marketplace/store/shared.css">

  <script src="/aitopia/marketplace/js/inline/settings-profile-inline-1.js"></script>
  <script src="/aitopia/marketplace/js/inline/settings-profile-inline-2.js"></script>
</head>

<body class="min-h-screen font-sans antialiased bg-white dark:bg-neutral-950 text-gray-900 dark:text-white transition-colors aifnmjmchg aifnmjmchg-marketplace">
  <div id="navbar-container"></div>
  <script src="/aitopia/marketplace/js/shared/cache.js"></script>
  <script src="/aitopia/marketplace/js/components/navbar.js"></script>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Profile Settings</h1>
        <p class="text-sm text-muted-foreground mt-1">Customize how others see you on AITOPIA</p>
      </div>
      <a id="viewProfileLink" href="#" class="hidden h-10 px-4 items-center justify-center gap-2 rounded-full border border-border hover:bg-secondary text-sm font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        View
      </a>
    </div>

    <div id="notice" class="hidden rounded-xl border border-border bg-card p-4 text-sm mb-6"></div>

    <form id="form" class="space-y-6">
      <section class="rounded-2xl border border-border bg-card p-6">
        <h2 class="text-base font-semibold mb-4">Profile Picture</h2>
        <div class="flex items-center gap-6">
          <div class="relative group">
            <div class="w-24 h-24 rounded-full bg-secondary overflow-hidden flex items-center justify-center ring-4 ring-background">
              <img id="avatarPreview" class="w-full h-full object-cover hidden" alt="" />
              <div id="avatarFallback" class="w-full h-full bg-primary flex items-center justify-center text-3xl font-bold text-white">@</div>
            </div>
            <label class="absolute inset-0 flex items-center justify-center bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
              <input id="avatarFile" type="file" accept="image/*" class="hidden">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </label>
          </div>
          <div class="flex-1 space-y-3">
            <div>
              <input id="avatarUrl" type="text" class="w-full h-10 px-4 rounded-xl bg-secondary/60 border border-border text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/30 transition-all" placeholder="Or paste image URL">
            </div>
            <div class="flex items-center gap-3">
              <button type="button" id="avatarFileBtn" class="h-9 px-4 rounded-full bg-secondary hover:bg-secondary/80 text-sm font-medium transition-colors inline-flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Upload
              </button>
              <span id="avatarFileName" class="text-xs text-muted-foreground truncate"></span>
              <span id="avatarUploadStatus" class="text-xs text-muted-foreground"></span>
            </div>
          </div>
        </div>
      </section>

      <section class="rounded-2xl border border-border bg-card p-6 space-y-5">
        <h2 class="text-base font-semibold">Basic Information</h2>

        <div>
          <label class="block text-sm font-medium mb-2">Username</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground">@</span>
            <input id="username" type="text" class="w-full h-11 pl-8 pr-4 rounded-xl bg-secondary/60 border border-border text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/30 transition-all" placeholder="yourname" autocomplete="off">
          </div>
          <p id="usernameHint" class="mt-2 text-xs text-muted-foreground">3-30 characters: lowercase letters, numbers, dots, underscores</p>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Display Name <span class="text-muted-foreground font-normal">(optional)</span></label>
          <input id="displayName" type="text" class="w-full h-11 px-4 rounded-xl bg-secondary/60 border border-border text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/30 transition-all" placeholder="Jane Doe">
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Bio <span class="text-muted-foreground font-normal">(optional)</span></label>
          <textarea id="bio" rows="3" class="w-full p-4 rounded-xl bg-secondary/60 border border-border text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/30 transition-all resize-none" placeholder="Tell people about yourself..."></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-2">Website <span class="text-muted-foreground font-normal">(optional)</span></label>
          <div class="relative">
            <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
            <input id="websiteUrl" type="text" class="w-full h-11 pl-11 pr-4 rounded-xl bg-secondary/60 border border-border text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary/30 transition-all" placeholder="https://yoursite.com">
          </div>
        </div>
      </section>

      <div class="flex items-center justify-between gap-2 pt-2 flex-wrap sm:flex-nowrap">
        <div class="flex items-center gap-2 sm:gap-3">
          <button id="saveBtn" type="submit" class="h-10 sm:h-11 px-5 sm:px-8 rounded-full bg-primary text-primary-foreground text-xs sm:text-sm font-semibold hover:bg-primary/90 transition-colors inline-flex items-center gap-1.5 whitespace-nowrap">
            <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Save
          </button>
          <a href="/aitopia/marketplace/outputs.html" class="h-10 sm:h-11 px-4 sm:px-6 inline-flex items-center justify-center rounded-full border border-border hover:bg-secondary text-xs sm:text-sm font-medium transition-colors whitespace-nowrap">
            Cancel
          </a>
        </div>
        <button id="deleteAccountBtn" type="button" class="h-10 sm:h-11 px-4 sm:px-6 rounded-full border border-gray-300 dark:border-neutral-700 text-gray-400 dark:text-neutral-500 text-xs sm:text-sm font-medium hover:text-red-500 hover:border-red-500/30 hover:bg-red-500/5 dark:hover:text-red-400 dark:hover:border-red-500/30 dark:hover:bg-red-500/10 transition-colors inline-flex items-center gap-1.5 whitespace-nowrap">
          <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          Delete Account
        </button>
      </div>
    </form>
  </main>

  <script type="module" src="/aitopia/marketplace/js/shared/fetch-helper.js"></script>
  <script type="module" src="/aitopia/marketplace/js/profile/settings-profile.js"></script>
  <script src="/aitopia/marketplace/js/shared/global-nav.js"></script>
<script src="/aitopia/marketplace/js/shared/footer.js"></script>
</body>
</html>
