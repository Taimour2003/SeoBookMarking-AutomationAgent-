name: Automatic Release Builder

# Signal: Jab bhi koi 'v' se start hone wala tag push ho (e.g. v1.0.0, v1.0.1)
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    # GitHub cloud par Windows PC start karega
    runs-on: windows-latest

    steps:
      # Step 1: Virtual machine par aapka code pull/download karega
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Python environment install karega
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Required libraries aur PyInstaller install karega
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      # Step 4: App ko .exe mein compile karega
      - name: Build Executable File
        run: |
          pyinstaller --onefile --name "MyApp" MainBrowserAgent/src/main.py

      # Step 5: Automatic Release banayega aur dist/MyApp.exe ko attach kar dega
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MyApp.exe
          name: Release ${{ github.ref_name }}
          body: |
            Automated Release for version ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}